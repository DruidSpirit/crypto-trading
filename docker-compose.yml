services:
  python-strategy-service:
    build:
      context: ./python-strategy-service
    image: crypto-trading-python-strategy-service:latest
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      RELOAD: "false"
      DATABASE_URL: sqlite:////app/data/crypto_trading.db
    ports:
      - "8001:8001"
    volumes:
      - python-strategy-data:/app/data
      - strategy-files:/app/src/strategies
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  crypto-trading:
    build:
      context: .
    image: crypto-trading-app:latest
    depends_on:
      python-strategy-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/db/tool
      LOGGING_FILE_NAME: /app/log/tool.log
      PYTHON_STRATEGY_API_BASE_URL: http://python-strategy-service:8001
      PYTHON_STRATEGY_SERVICE_URL: http://python-strategy-service:8001
      STRATEGY_UPLOAD_PATH: /app/python-strategy-service/src/strategies
    ports:
      - "5567:5567"
    volumes:
      - java-db:/app/db
      - java-log:/app/log
      - strategy-files:/app/python-strategy-service/src/strategies

volumes:
  java-db:
  java-log:
  python-strategy-data:
  strategy-files:
